# =============================================================================
# Abu Clock — SMPTE ST 2059-2 Broadcast Media Profile Grandmaster Configuration
# Compatible with ptp4l / statime-linux on Raspberry Pi CM4 / Pi 5 (/dev/ptp0)
# =============================================================================
[global]
domainNumber                1
priority1                   64
priority2                   128
clockClass                  248
clockAccuracy               0x21
offsetScaledLogVariance     0x436A
logAnnounceInterval         -1
logSyncInterval             -3
logMinDelayReqInterval      -3
announceReceiptTimeout      3
delay_mechanism             E2E
network_transport           UDPv4
time_stamping               hardware
tx_timestamp_timeout        50
utc_offset                  37
timeSource                  0xA0

[eth0]
network_transport           UDPv4
delay_mechanism             E2E
