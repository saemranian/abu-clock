# =============================================================================
# Abu Clock — IEEE 802.1AS (gPTP) Master Profile for RoboSense E1R / RS-LiDAR
# Connects via RoboSense E1R Power & Ethernet Interface Box (1000BASE-T1 -> RJ-45)
# =============================================================================
[global]
gmCapable                   1
priority1                   64
priority2                   128
clockClass                  248
clockAccuracy               0x21
offsetScaledLogVariance     0x436A
domainNumber                0
logAnnounceInterval         0
logSyncInterval             -3
logMinPdelayReqInterval     0
announceReceiptTimeout      3
syncReceiptTimeout          3
transportSpecific           0x1
ptp_dst_mac                 01:80:C2:00:00:0E
p2p_dst_mac                 01:80:C2:00:00:0E
delay_mechanism             P2P
network_transport           L2
time_stamping               hardware
step_threshold              0.00002

[eth1]
network_transport           L2
delay_mechanism             P2P
