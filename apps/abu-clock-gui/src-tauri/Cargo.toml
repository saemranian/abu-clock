[package]
name = "abu-clock-gui-shell"
version = "0.0.6"
edition = "2021"
authors = ["Ahmad Emranian <saemranian@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Tauri v2 cross-platform backend shell for Abu Clock (PC, Mac, Linux, iOS, Android)"

[lib]
name = "abu_clock_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
abu-clock-core = { path = "../../../crates/abu-clock-core" }
abu-network = { path = "../../../crates/abu-network" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
