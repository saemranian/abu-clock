[package]
name = "abu-clock-gui-shell"
version = "0.0.14"
edition = "2021"
authors = ["Ahmad Emranian <saemranian@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Abu Clock Unified PC Application & Control Center (Core, PTP, Trigger, Telemetry, FFI & Appliance)"
default-run = "abu-clock"

[lib]
name = "abu_clock_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "abu-clock"
path = "src/main.rs"

[[bin]]
name = "abu-clock-mcp"
path = "src/bin/abu_clock_mcp.rs"

[dependencies]
abu-clock-core = { path = "../../../crates/abu-clock-core" }
abu-network = { path = "../../../crates/abu-network" }
abu-ffi = { path = "../../../crates/abu-ffi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
